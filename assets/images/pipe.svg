<svg xmlns="http://www.w3.org/2000/svg" width="72" height="560" viewBox="0 0 72 560" preserveAspectRatio="none" shape-rendering="crispEdges">
  <!-- body (outline) -->
  <rect x="4" y="30" width="64" height="530" fill="#4a3a45"/>
  <!-- body fill -->
  <rect x="7" y="30" width="58" height="530" fill="#73bf2e"/>
  <!-- left highlight -->
  <rect x="10" y="30" width="8" height="530" fill="#a3e95a"/>
  <rect x="20" y="30" width="3" height="530" fill="#8fd646"/>
  <!-- right shade -->
  <rect x="50" y="30" width="6" height="530" fill="#5fa423"/>
  <rect x="56" y="30" width="9" height="530" fill="#4c8a1b"/>
  <!-- cap (outline) -->
  <rect x="0" y="0" width="72" height="34" rx="3" fill="#4a3a45"/>
  <!-- cap fill -->
  <rect x="3" y="3" width="66" height="28" fill="#73bf2e"/>
  <rect x="6" y="3" width="10" height="28" fill="#a3e95a"/>
  <rect x="18" y="3" width="4" height="28" fill="#8fd646"/>
  <rect x="50" y="3" width="8" height="28" fill="#5fa423"/>
  <rect x="58" y="3" width="11" height="28" fill="#4c8a1b"/>
  <!-- cap shadow onto body -->
  <rect x="7" y="34" width="58" height="6" fill="#000" opacity="0.18"/>
</svg>
